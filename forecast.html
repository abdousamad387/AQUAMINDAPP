<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQUAMIND - Prédictions Avancées</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .navbar { background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%) !important; box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 1rem 2rem !important; }
        .navbar-brand { font-size: 1.8rem; font-weight: 800; color: #fff !important; }
        .nav-link { color: #fff !important; font-weight: 600; margin-left: 1.5rem; transition: all 0.3s; }
        .nav-link:hover, .nav-link.active { color: #00bcd4 !important; border-bottom: 2px solid #00bcd4; }
        
        .container-main { max-width: 1400px; margin: 0 auto; padding: 2rem 1rem; }
        .page-title { color: #fff; font-size: 2.5rem; font-weight: 800; margin-bottom: 2rem; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        
        .forecast-card {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-top: 4px solid #667eea;
            transition: all 0.3s;
        }
        
        .forecast-card:hover { transform: translateY(-5px); box-shadow: 0 12px 35px rgba(0,0,0,0.2); }
        
        .forecast-date { font-size: 0.9rem; color: #999; font-weight: 600; }
        .forecast-level { font-size: 2rem; font-weight: 800; color: #1e293b; margin: 0.5rem 0; }
        .forecast-confidence { font-size: 0.85rem; color: #666; }
        .confidence-bar {
            background: #f0f0f0;
            height: 8px;
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .confidence-fill { background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); height: 100%; }
        
        .control-btn {
            background: #fff;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 0.5rem;
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: #667eea;
        }
        
        .control-btn:hover { transform: translateY(-2px); }
        
        .chart-box {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            min-height: 400px;
        }
        
        .chart-title { font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 1rem; }
        
        .model-card {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        
        .model-card:hover { transform: translateY(-5px); box-shadow: 0 12px 35px rgba(0,0,0,0.2); }
        
        .model-name { font-size: 1.1rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; }
        .model-accuracy { font-size: 2rem; font-weight: 800; color: #667eea; margin-bottom: 0.5rem; }
        .model-status { font-size: 0.85rem; color: #666; }
        
        @media (max-width: 768px) {
            .page-title { font-size: 1.8rem; }
            .forecast-level { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="fas fa-water"></i> AQUAMIND</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">📊 Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="forecast.html">🔮 Prédictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="analytics.html">📈 Analytics</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">🏠 Accueil</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="container-main">
        <h1 class="page-title">🔮 Prédictions Avancées</h1>

        <!-- CONTROLS -->
        <div style="background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 8px 25px rgba(0,0,0,0.1);">
            <button class="control-btn active" onclick="setForecastPeriod(7, this)">7 jours</button>
            <button class="control-btn" onclick="setForecastPeriod(14, this)">14 jours</button>
            <button class="control-btn" onclick="setForecastPeriod(30, this)">30 jours</button>
            <button class="control-btn" onclick="setForecastPeriod(90, this)">Saisonnier</button>
        </div>

        <!-- FORECAST CARDS -->
        <div id="forecastCardsContainer" class="row"></div>

        <!-- CONFIDENCE CHART -->
        <div class="chart-box">
            <div class="chart-title">📊 Intervalle de Confiance 7 Jours</div>
            <canvas id="confidenceChart"></canvas>
        </div>

        <!-- MODEL COMPARISON -->
        <h2 class="page-title">🤖 Comparaison des Modèles</h2>
        <div class="row" id="modelsContainer"></div>

        <!-- PREDICTION TRENDS -->
        <div class="chart-box">
            <div class="chart-title">📈 Trends de Prédiction</div>
            <canvas id="trendsChart"></canvas>
        </div>

        <!-- RISK ASSESSMENT -->
        <h2 class="page-title">⚠️ Évaluation des Risques</h2>
        <div class="row" id="riskContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let forecastDays = 7;
        let charts = {};

        function getRandomInRange(min, max) {
            return parseFloat((Math.random() * (max - min) + min).toFixed(2));
        }

        function generateForecasts(days) {
            const forecasts = [];
            const today = new Date();
            
            for (let i = 1; i <= days; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                forecasts.push({
                    date: date.toLocaleDateString('fr-FR', { weekday: 'short', month: 'short', day: 'numeric' }),
                    level: getRandomInRange(82, 92),
                    confidence: getRandomInRange(85, 98),
                    trend: Math.random() > 0.5 ? '↑' : '↓'
                });
            }
            return forecasts;
        }

        function generateModels() {
            return [
                { name: 'LSTM', accuracy: 94, status: '✅ Actif' },
                { name: 'Transformer', accuracy: 91, status: '✅ Actif' },
                { name: 'ConvLSTM', accuracy: 89, status: '✅ Actif' },
                { name: 'Graph NN', accuracy: 88, status: '⏳ Entrainement' },
                { name: 'Ensemble', accuracy: 95, status: '✅ Actif' }
            ];
        }

        function generateRisks() {
            return [
                { level: '🔴 Critique', desc: 'Risque de crue', prob: '15%', color: '#ef4444' },
                { level: '🟡 Moyen', desc: 'Débit important', prob: '42%', color: '#f59e0b' },
                { level: '🟢 Faible', desc: 'Conditions normales', prob: '43%', color: '#10b981' }
            ];
        }

        // ========== INIT GRAPHIQUES ==========
        function initCharts() {
            initConfidenceChart();
            initTrendsChart();
        }

        function initConfidenceChart() {
            const forecasts = generateForecasts(7);
            const ctx = document.getElementById('confidenceChart').getContext('2d');
            
            charts.confidence = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: forecasts.map(f => f.date),
                    datasets: [{
                        label: 'Niveau prédit',
                        data: forecasts.map(f => f.level),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2
                    }, {
                        label: 'Limite haute',
                        data: forecasts.map(f => f.level + 3),
                        borderColor: '#ef4444',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        fill: false,
                        pointRadius: 0
                    }, {
                        label: 'Limite basse',
                        data: forecasts.map(f => f.level - 3),
                        borderColor: '#10b981',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        fill: false,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: false, min: 75, max: 100 } }
                }
            });
        }

        function initTrendsChart() {
            const ctx = document.getElementById('trendsChart').getContext('2d');
            
            charts.trends = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Sem. 1', 'Sem. 2', 'Sem. 3', 'Sem. 4', 'Sem. 5'],
                    datasets: [
                        {
                            label: 'Réel',
                            data: [85, 86, 84, 87, 88],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 3,
                            tension: 0.4
                        },
                        {
                            label: 'Prédit',
                            data: [84.5, 85.8, 83.9, 87.2, 87.5],
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: false } }
                }
            });
        }

        // ========== RENDUS ==========
        function renderForecasts() {
            const forecasts = generateForecasts(forecastDays);
            const html = forecasts.map(f => `
                <div class="col-md-6 col-lg-${forecastDays <= 7 ? '2' : '4'}">
                    <div class="forecast-card">
                        <div class="forecast-date">${f.date}</div>
                        <div class="forecast-level">${f.level.toFixed(1)} cm ${f.trend}</div>
                        <div class="forecast-confidence">Confiance: ${f.confidence.toFixed(0)}%</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${f.confidence}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('forecastCardsContainer').innerHTML = html;
        }

        function renderModels() {
            const models = generateModels();
            const html = models.map(m => `
                <div class="col-md-6 col-lg-4">
                    <div class="model-card">
                        <div class="model-name">${m.name}</div>
                        <div class="model-accuracy">${m.accuracy}%</div>
                        <div class="model-status">${m.status}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('modelsContainer').innerHTML = html;
        }

        function renderRisks() {
            const risks = generateRisks();
            const html = risks.map(r => `
                <div class="col-md-6 col-lg-4">
                    <div style="background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-left: 5px solid ${r.color};">
                        <div style="font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem;">${r.level}</div>
                        <div style="color: #666; margin-bottom: 1rem;">${r.desc}</div>
                        <div style="font-size: 1.5rem; font-weight: 800; color: ${r.color};">${r.prob}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('riskContainer').innerHTML = html;
        }

        // ========== CONTRÔLES ==========
        function setForecastPeriod(days, btn) {
            forecastDays = days;
            document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderForecasts();
            initConfidenceChart();
        }

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderForecasts();
            renderModels();
            renderRisks();
            initCharts();
        });
    </script>
</body>
</html>
